<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Serviços</title>
  <style>
    :root {
      --primary: #0056b3;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333;
      --border: #ddd;
    }
    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .step { display: none; }
    .step.active { display: block; }
    button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-size: 16px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
    .card-option { border: 1px solid var(--border); padding: 15px; border-radius: 6px; text-align: center; cursor: pointer; background: #fff; }
    .card-option.selected { border-color: var(--primary); background: #e9f2ff; font-weight: bold; }
    .time-slot { padding: 10px; border: 1px solid var(--border); text-align: center; border-radius: 4px; cursor: pointer; }
    .time-slot.disabled { background: #fee; color: #999; cursor: not-allowed; border-color: #fcc; }
    .time-slot.selected { background: var(--primary); color: #fff; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px; }
    .badge { display: inline-block; padding: 4px 8px; background: #eee; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div id="badge-unidade" class="badge"></div>

  <!-- STEP 0: Seleção de Marca -->
  <div id="step-0" class="step active">
    <h2>Selecione a Marca</h2>
    <div class="grid">
      <div class="card-option" onclick="selecionarMarca('Suzuki')">Suzuki</div>
      <div class="card-option" onclick="selecionarMarca('Haojue')">Haojue</div>
      <div class="card-option" onclick="selecionarMarca('Kymco')">Kymco</div>
    </div>
  </div>

  <!-- STEP 1: Seleção de Unidade -->
  <div id="step-1" class="step">
    <h2>Selecione a Unidade</h2>
    <div class="grid" id="unidades-container"></div>
    <button onclick="mudarPasso(0)">Voltar</button>
  </div>

  <!-- STEP 2: Data e Horário -->
  <div id="step-2" class="step">
    <h2>Escolha Data e Horário</h2>
    <div class="form-group">
      <label for="data-agendamento">Data:</label>
      <input type="date" id="data-agendamento" onchange="onDateChange(this.value)">
    </div>
    <div id="time-grid" class="grid"></div>
    <button onclick="mudarPasso(1)">Voltar</button>
    <button id="btn-step2-next" onclick="mudarPasso(3)" disabled>Avançar</button>
  </div>

  <!-- STEP 3: Dados do Cliente e Veículo -->
  <div id="step-3" class="step">
    <h2>Dados para Agendamento</h2>
    <form id="form-agendamento" onsubmit="finalizarAgendamento(event)">
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" required>
      </div>
      <div class="form-group">
        <label for="telefone">WhatsApp / Telefone:</label>
        <input type="tel" id="telefone" placeholder="(13) 99999-9999" required>
      </div>
      <div class="form-group">
        <label for="modelo">Modelo da Moto:</label>
        <input type="text" id="modelo" required>
      </div>
      <div class="form-group">
        <label for="servico">Tipo de Serviço:</label>
        <select id="servico" required>
          <option value="">Selecione...</option>
          <option value="Revisão Periódica">Revisão Periódica</option>
          <option value="Manutenção / Reparo">Manutenção / Reparo</option>
          <option value="Garantia / Recall">Garantia / Recall</option>
        </select>
      </div>
      <button type="button" onclick="mudarPasso(2)">Voltar</button>
      <button type="submit" id="btn-finalizar">Confirmar Agendamento</button>
    </form>
  </div>
</div>

<!-- Configurações Globais (Devam ficar ANTES dos scripts operacionais) -->
<script>
  const CONFIG = {
    APPS_SCRIPT_URL: "https://script.google.com/macros/s/SEU_SCRIPT_ID_AQUI/exec",
    WA_NUM: "5513999999999",
    UNIDADES: {
      "Santos": { tel: "5513999990001", endereco: "Av. Ana Costa, Santos - SP" },
      "São Vicente": { tel: "5513999990002", endereco: "Av. Presidente Wilson, São Vicente - SP" },
      "Praia Grande": { tel: "5513999990003", endereco: "Av. Ayrton Senna, Praia Grande - SP" },
      "Guarujá": { tel: "5513999990004", endereco: "Av. Adhemar de Barros, Guarujá - SP" },
      "Peruíbe": { tel: "5513999990005", endereco: "Av. Padre Anchieta, Peruíbe - SP" }
    },
    HORARIOS: ["08:00", "09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00"]
  };

  let estadoAgendamento = {
    marca: "",
    unidade: "",
    data: "",
    horario: "",
    cliente: {}
  };
</script>

<script>
  // Lógica de manipulação da aplicação
  function mudarPasso(passo) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById(`step-${passo}`).classList.add('active');
  }

  function selecionarMarca(marca) {
    estadoAgendamento.marca = marca;
    renderUnidades();
    mudarPasso(1);
  }

  function renderUnidades() {
    const container = document.getElementById('unidades-container');
    container.innerHTML = '';
    Object.keys(CONFIG.UNIDADES).forEach(unidade => {
      const card = document.createElement('div');
      card.className = 'card-option';
      card.innerText = unidade;
      card.onclick = () => selecionarUnidade(unidade);
      container.appendChild(card);
    });
  }

  function selecionarUnidade(unidade) {
    estadoAgendamento.unidade = unidade;
    document.getElementById('badge-unidade').innerText = `Unidade: ${unidade} | Marca: ${estadoAgendamento.marca}`;
    
    // Configurar limite do DatePicker (Data mínima: Hoje)
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('data-agendamento').min = today;
    
    mudarPasso(2);
  }

  async function onDateChange(data) {
    if (!data) return;
    estadoAgendamento.data = data;
    estadoAgendamento.horario = "";
    document.getElementById('btn-step2-next').disabled = true;

    const grid = document.getElementById('time-grid');
    grid.innerHTML = '<p>Buscando horários disponíveis...</p>';

    try {
      const ocupados = await consultarHorariosOcupados(data, estadoAgendamento.unidade);
      buildTimeGrid(ocupados);
    } catch (err) {
      grid.innerHTML = '<p style="color:red;">Erro ao carregar horários. Tente novamente.</p>';
    }
  }

  async function consultarHorariosOcupados(data, unidade) {
    const response = await chamarBackend({
      action: 'horarios_ocupados',
      data: data,
      unidade: unidade
    });
    return response.ocupados || [];
  }

  function buildTimeGrid(ocupados) {
    const grid = document.getElementById('time-grid');
    grid.innerHTML = '';

    CONFIG.HORARIOS.forEach(hora => {
      const slot = document.createElement('div');
      const isOcupado = ocupados.includes(hora);
      
      slot.className = `time-slot ${isOcupado ? 'disabled' : ''}`;
      slot.innerText = hora;

      if (!isOcupado) {
        slot.onclick = () => {
          document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
          slot.classList.add('selected');
          estadoAgendamento.horario = hora;
          document.getElementById('btn-step2-next').disabled = false;
        };
      }
      grid.appendChild(slot);
    });
  }

  async function finalizarAgendamento(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-finalizar');
    btn.disabled = true;
    btn.innerText = "Agendando...";

    estadoAgendamento.cliente = {
      nome: document.getElementById('nome').value,
      telefone: document.getElementById('telefone').value,
      modelo: document.getElementById('modelo').value,
      servico: document.getElementById('servico').value
    };

    try {
      const res = await chamarBackend({
        action: 'confirmar_agendamento',
        ...estadoAgendamento
      });

      if (res.status === 'success') {
        alert('Agendamento realizado com sucesso!');
        redirecionarWhatsApp();
      } else {
        alert('Erro ao agendar: ' + (res.message || 'Tente novamente.'));
      }
    } catch (err) {
      alert('Erro de comunicação com o servidor.');
    } finally {
      btn.disabled = false;
      btn.innerText = "Confirmar Agendamento";
    }
  }

  async function chamarBackend(payload) {
    const params = new URLSearchParams();
    params.append('payload', JSON.stringify(payload));

    const response = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      body: params
    });
    return await response.json();
  }

  function redirecionarWhatsApp() {
    const infoUnidade = CONFIG.UNIDADES[estadoAgendamento.unidade];
    const rawTel = (infoUnidade && infoUnidade.tel) ? infoUnidade.tel : CONFIG.WA_NUM;
    const numZap = rawTel.replace(/\D/g, ''); // Remove caracteres não numéricos

    const msg = `Olá! Fiz um agendamento pelo site.
*Nome:* ${estadoAgendamento.cliente.nome}
*Marca/Modelo:* ${estadoAgendamento.marca} - ${estadoAgendamento.cliente.modelo}
*Serviço:* ${estadoAgendamento.cliente.servico}
*Unidade:* ${estadoAgendamento.unidade}
*Data/Hora:* ${estadoAgendamento.data} às ${estadoAgendamento.horario}`;

    const url = `https://wa.me/${numZap}?text=${encodeURIComponent(msg)}`;
    window.location.href = url;
  }
</script>
</body>
</html>
