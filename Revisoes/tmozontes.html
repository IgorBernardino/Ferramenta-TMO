<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora de Revisão Zontes</title>
    <link rel="stylesheet" href="/Ferramenta-TMO/style/revisoes.css">
</head>
<body>
     <!-- 🏠 BOTÃO HOME FIXO -->
    <a href="/Ferramenta-TMO/index.html" class="btn-home" title="Página Inicial">
        🏠
    </a>
<div class="container">
    <div class="header">
        <h1>🏍️ Calculadora de Revisão Zontes</h1>
        <p>Selecione o veículo e a quilometragem para ver as peças e os custos da revisão</p>
    </div>

     <div class="controls">
    <div class="select-group">
      <label for="veiculoSelect"></label>
      <select id="veiculoSelect" onchange="atualizarImagemVeiculo();">
                <option value="">Selecione o Veículo</option>
                <option value="V350">V 350</option>
                <option value="T350">T 350 / T 350 X</option>
                <option value="GK350">GK 350</option>
                <option value="S350">S 350</option>
                <option value="R350">R 350</option>
                <option value="E350">350 E</option>
            </select>

             <!--caixa da imagem das motos-->
            <div class="veiculo-card" id="veiculoCard">
            <img id="img-veiculo" alt="Veículo selecionado">
             <div class="veiculo-nome" id="veiculoNome"></div>
            </div>

            
            <select id="kmSelect">
                <option value="">Selecione KM</option>
                <option value="1000">1.000 km</option>
                <option value="3000">3.000 km</option>
                <option value="6000">6.000 km</option>
                <option value="9000">9.000 km</option>
                <option value="12000">12.000 km</option>
                <option value="15000">15.000 km</option>
                <option value="18000">18.000 km</option>
            </select>
        </div>

        <div class="resumo-grid">
            <div class="valor-card valor-pecas">
                <div class="valor-label">Peças</div>
                <div class="valor-numero" id="totalPecas">R$ 0,00</div>
                <div class="valor-sub" id="subPecas">Sem itens selecionados</div>
            </div>
            <div class="valor-card valor-tmo">
                <div class="valor-label">Mão de Obra</div>
                <div class="valor-numero" id="totalTMO">R$ 0,00</div>
                <div class="valor-sub" id="subTMO">0,0 h × R$ 350,00/h</div>
            </div>
            <div class="valor-card valor-total">
                <div class="valor-label">Total</div>
                <div class="valor-numero" id="totalGeral">R$ 0,00</div>
                <div class="valor-sub" id="subTotal">Peças + Mão de Obra</div>
            </div>
        </div>
    </div>

    <div class="pecas-lista" id="listaPecas">
        <div class="no-result">👆 Selecione veículo e KM para ver as peças da revisão</div>
    </div>
</div>
<script src="/Ferramenta-TMO/script/revisaozontes.js"></script>
</body>
</html>
